{% extends "base.html" %}
{% block title %}Login — DayTone AI{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-panel">
        <a href="{{ url_for('index') }}" class="back-link">← Back to DayTone</a>
        <div class="auth-logo">D</div>
        <div class="eyebrow">WELCOME BACK</div>
        <h1>Good to see you.</h1>
        <p class="muted">Sign in to continue your wellness journey.</p>
        <form method="POST" class="form">
            <label>Email address</label>
            <input type="email" name="email" placeholder="you@example.com" required>
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>
            <button class="btn primary full">Log in</button>
        </form>
        <p class="auth-switch">Don't have an account? <a href="{{ url_for('register') }}">Create one</a></p>
    </div>
</div>
{% endblock %}
