{% extends "base.html" %}
{% block title %}Create Account — DayTone AI{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-panel">
        <a href="{{ url_for('index') }}" class="back-link">← Back to DayTone</a>
        <div class="auth-logo">D</div>
        <div class="eyebrow">START YOUR JOURNEY</div>
        <h1>Create your account.</h1>
        <p class="muted">A private space for daily self-reflection.</p>
        <form method="POST" class="form">
            <label>Your name</label>
            <input type="text" name="name" placeholder="Your name" required>
            <label>Email address</label>
            <input type="email" name="email" placeholder="you@example.com" required>
            <label>Password</label>
            <input type="password" name="password" placeholder="Create a password" minlength="6" required>
            <button class="btn primary full">Create account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
</div>
{% endblock %}
